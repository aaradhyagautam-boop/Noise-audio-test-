<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Connected Devices — Noise Audio DLS</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Saira:wght@500;600&family=Geist:wght@400;600&display=swap" rel="stylesheet" />
<style>
/*
 * Self-contained, INTERACTIVE recreation of the Connected Devices screen.
 * Tokens mirror the Noise Audio DLS (design-system-rules.md); none invented.
 * No build step / no server required — open this file directly in a browser.
 *
 * Wired actionables:
 *  - Checkbox (Checkbox Card actionable): click to select/deselect.
 *  - Toggle (Dual Pairing, OUT OF REGISTRY): click to flip on/off.
 *  - Cross (Checkbox Card actionable): click to remove the row.
 *  - "X/2" selection counter updates live; max 2 selected (per the "/2").
 */
:root{
  /* Semantic Colors */
  --color-text-primary:#454545;            /* text/primary */
  --color-text-secondary:#919191;          /* text/secondary */
  --color-text-tertiary:#b5b5b5;           /* text/tertiary */
  --color-icon-primary:#454545;            /* icon/primary */
  --color-border-disable:#ededed;          /* border/disable */
  --color-button-checkbox-checked:#171717; /* button/checkbox/checked */
  --color-button-checkbox-unchecked:#b5b5b5; /* button/checkbox/unchecked */
  --color-button-actionable-enabled:#919191; /* button/actionable/enabled */
  --color-background-surface:#f7f7f7;      /* background/surface */
  --color-default-status-bar:#000000;      /* default/status bar */
  /* Spacing & Radius */
  --gap-l2-card:16px;                       /* Gaps/L2-Card Gap */
  --padding-top-bottom-small:12px;          /* Padding/top, bottom padding small */
  --radius-card:18px;                       /* Radius/Card */
  /* Typography */
  --type-headings-medium-family:'Saira',sans-serif; /* 👄 Headings/Medium */
  --type-subheading-card-family:'Saira',sans-serif; /* Sub Headings/card headings */
  --type-content-small-family:'Geist',sans-serif;   /* Content/Small */
}
*{box-sizing:border-box}
body{margin:0;background:#e9e9e9;display:flex;justify-content:center;padding:24px;font-family:var(--type-content-small-family)}
.device-frame{width:390px;min-height:844px;background:#fff;position:relative;display:flex;flex-direction:column;overflow:hidden}

/* Status Bar (Atom, L0) */
.statusbar{height:59px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;color:var(--color-default-status-bar);flex:0 0 auto}
.statusbar__time{font-family:var(--type-subheading-card-family);font-weight:600;font-size:16px}
.statusbar__glyphs{display:flex;align-items:center;gap:6px}

/* L1 Inner Page Navigation (Organism, L1) — Type=No icon */
.l1-nav{display:flex;align-items:center;width:100%;padding:6px 20px;flex:0 0 auto}
.l1-nav__back{background:none;border:none;padding:4px;cursor:pointer;color:var(--color-icon-primary);display:inline-flex}

/* L2 Inner Page Heading (Molecule, L2) */
.l2-heading{min-height:56px;padding:8px 24px 16px;display:flex;align-items:flex-end;flex:0 0 auto}
.l2-heading__title{margin:0;color:var(--color-text-primary);font-family:var(--type-headings-medium-family);font-weight:600;font-size:34px;line-height:1.1;text-transform:uppercase;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* Heading Content (Atom) */
.heading-content{display:flex;flex-direction:column;gap:2px;min-width:0}
.heading-content__heading{font-family:var(--type-subheading-card-family);font-weight:500;font-size:16px;line-height:1.1;color:var(--color-text-primary);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.heading-content__support{font-family:var(--type-content-small-family);font-weight:400;font-size:12px;line-height:1.3;color:var(--color-text-secondary)}

/* Checkbox Card (Organism) — position=checkbox Left */
.checkbox-card{display:flex;align-items:center;gap:var(--gap-l2-card);padding:var(--padding-top-bottom-small) 16px;width:100%}
.checkbox-card__content{flex:1 1 auto;min-width:0}
.checkbox-card__cross{flex:0 0 auto;background:none;border:none;padding:4px;cursor:pointer;color:var(--color-button-actionable-enabled);display:inline-flex;border-radius:8px}

/* Checkbox actionable — state driven by .is-selected on the card */
.checkbox{width:24px;height:24px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;padding:0;cursor:pointer;background:transparent;border:2px solid var(--color-button-checkbox-unchecked);transition:background .12s ease,border-color .12s ease}
.checkbox__tick{display:none;color:#fff}
.checkbox-card.is-selected .checkbox{background:var(--color-button-checkbox-checked);border-color:var(--color-button-checkbox-checked)}
.checkbox-card.is-selected .checkbox__tick{display:block}
/* Unselected rows render the heading in tertiary (matches the greyed mockup state) */
.checkbox-card:not(.is-selected) .heading-content__heading{color:var(--color-text-tertiary)}

/* focus-visible affordance for keyboard users */
.checkbox:focus-visible,.checkbox-card__cross:focus-visible,.toggle:focus-visible,.l1-nav__back:focus-visible{outline:2px solid var(--color-text-primary);outline-offset:2px}

/* Grouped-list parent frame — Checkbox Card Parent Frame Rules */
.device-list{margin:0 16px;background:var(--color-background-surface);border-radius:var(--radius-card);padding-top:var(--padding-top-bottom-small);padding-bottom:var(--padding-top-bottom-small)}

/* OUT OF REGISTRY: Dual Pairing card (Master Card + Toggle) */
.oor-pairing-card{margin:8px 16px 0;background:var(--color-background-surface);border-radius:var(--radius-card);padding:var(--gap-l2-card);display:flex;align-items:center;gap:var(--gap-l2-card)}
.oor-pairing-card__content{flex:1 1 auto;min-width:0}
.toggle{width:44px;height:26px;border-radius:999px;border:none;cursor:pointer;position:relative;flex:0 0 auto;background:var(--color-button-checkbox-unchecked);transition:background .15s ease}
.toggle[aria-checked="true"]{background:var(--color-button-checkbox-checked)}
.toggle__knob{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s ease}
.toggle[aria-checked="true"] .toggle__knob{left:21px}

/* OUT OF REGISTRY: list section header */
.oor-section-header{display:flex;align-items:center;justify-content:space-between;padding:24px 24px 12px}
.oor-section-header__label,.oor-section-header__count{font-family:var(--type-content-small-family);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-text-secondary)}
.oor-section-header__count.is-at-capacity{color:var(--color-button-checkbox-checked);transition:color .15s ease}

/* OS chrome */
.home-indicator{margin-top:auto;display:flex;justify-content:center;padding:8px 0 10px}
.home-indicator span{width:134px;height:5px;border-radius:999px;background:var(--color-text-primary)}
</style>
</head>
<body>
<div class="device-frame">

  <!-- Status Bar (Atom, L0) -->
  <div class="statusbar">
    <span class="statusbar__time">9:41</span>
    <span class="statusbar__glyphs">
      <svg width="68" height="12" viewBox="0 0 68 12" fill="currentColor">
        <rect x="0" y="6" width="3" height="6" rx="1"/><rect x="5" y="4" width="3" height="8" rx="1"/>
        <rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/>
        <path d="M24 4c3-3 8-3 11 0l-1.4 1.4c-2.2-2.2-6-2.2-8.2 0L24 4zm2.6 2.6c1.6-1.6 4.2-1.6 5.8 0L31 8c-.8-.8-2.2-.8-3 0l-1.4-1.4zM28 9l1.5 1.5L31 9c-.8-.8-2.2-.8-3 0z"/>
        <rect x="46" y="1" width="20" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-width="1" opacity="0.5"/>
        <rect x="47.5" y="2.5" width="16" height="7" rx="1.5"/><rect x="67" y="4" width="1.5" height="4" rx="0.75" opacity="0.6"/>
      </svg>
    </span>
  </div>

  <!-- L1 Inner Page Navigation (Type=No icon) -->
  <nav class="l1-nav" aria-label="Page navigation">
    <button class="l1-nav__back" aria-label="Back" type="button">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </nav>

  <!-- L2 Inner Page Heading -->
  <header class="l2-heading"><h1 class="l2-heading__title">Connected Devices</h1></header>

  <!-- [OUT OF REGISTRY] Dual Pairing — Master Card + Toggle -->
  <div class="oor-pairing-card" data-out-of-registry="true">
    <div class="oor-pairing-card__content">
      <div class="heading-content">
        <span class="heading-content__heading">Dual Pairing</span>
        <span class="heading-content__support">Your buds can connect to 2 devices at a time.</span>
      </div>
    </div>
    <button class="toggle" type="button" role="switch" aria-checked="true" aria-label="Dual pairing"><span class="toggle__knob"></span></button>
  </div>

  <!-- [OUT OF REGISTRY] section header -->
  <div class="oor-section-header" data-out-of-registry="true">
    <span class="oor-section-header__label">My Devices</span>
    <span class="oor-section-header__count" data-count>1/2</span>
  </div>

  <!-- Grouped-list parent frame of Checkbox Cards (position=checkbox Left) -->
  <div class="device-list" role="list">

    <div role="listitem"><div class="checkbox-card is-selected">
      <button class="checkbox" type="button" aria-pressed="true" aria-label="Select device"><svg class="checkbox__tick" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M5 12.5L10 17.5L19 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div class="checkbox-card__content"><div class="heading-content"><span class="heading-content__heading">Manas's iPhone</span><span class="heading-content__support">Current Device</span></div></div>
      <button class="checkbox-card__cross" type="button" aria-label="Remove device"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    </div></div>

    <div role="listitem"><div class="checkbox-card">
      <button class="checkbox" type="button" aria-pressed="false" aria-label="Select device"><svg class="checkbox__tick" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M5 12.5L10 17.5L19 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div class="checkbox-card__content"><div class="heading-content"><span class="heading-content__heading">Manas's iPhone</span></div></div>
      <button class="checkbox-card__cross" type="button" aria-label="Remove device"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    </div></div>

    <div role="listitem"><div class="checkbox-card">
      <button class="checkbox" type="button" aria-pressed="false" aria-label="Select device"><svg class="checkbox__tick" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M5 12.5L10 17.5L19 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div class="checkbox-card__content"><div class="heading-content"><span class="heading-content__heading">Manas's iPhone</span></div></div>
      <button class="checkbox-card__cross" type="button" aria-label="Remove device"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    </div></div>

    <div role="listitem"><div class="checkbox-card">
      <button class="checkbox" type="button" aria-pressed="false" aria-label="Select device"><svg class="checkbox__tick" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M5 12.5L10 17.5L19 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div class="checkbox-card__content"><div class="heading-content"><span class="heading-content__heading">Manas's iPhone</span></div></div>
      <button class="checkbox-card__cross" type="button" aria-label="Remove device"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    </div></div>

    <div role="listitem"><div class="checkbox-card">
      <button class="checkbox" type="button" aria-pressed="false" aria-label="Select device"><svg class="checkbox__tick" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M5 12.5L10 17.5L19 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div class="checkbox-card__content"><div class="heading-content"><span class="heading-content__heading">Manas's iPhone</span></div></div>
      <button class="checkbox-card__cross" type="button" aria-label="Remove device"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    </div></div>

    <div role="listitem"><div class="checkbox-card">
      <button class="checkbox" type="button" aria-pressed="false" aria-label="Select device"><svg class="checkbox__tick" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M5 12.5L10 17.5L19 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div class="checkbox-card__content"><div class="heading-content"><span class="heading-content__heading">Manas's iPhone</span></div></div>
      <button class="checkbox-card__cross" type="button" aria-label="Remove device"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    </div></div>

  </div>

  <div class="home-indicator"><span></span></div>
</div>

<script>
(function () {
  'use strict';
  // Max selectable devices is derived from the "/2" denominator in the counter.
  var MAX_SELECTED = 2;
  var countEl = document.querySelector('[data-count]');

  function selectedCount() {
    return document.querySelectorAll('.checkbox-card.is-selected').length;
  }

  function refreshCounter() {
    var n = selectedCount();
    if (countEl) {
      countEl.textContent = n + '/' + MAX_SELECTED;
      countEl.classList.toggle('is-at-capacity', n >= MAX_SELECTED);
    }
  }

  function setSelected(card, selected) {
    card.classList.toggle('is-selected', selected);
    var cb = card.querySelector('.checkbox');
    if (cb) cb.setAttribute('aria-pressed', String(selected));
  }

  // Checkbox actionable: select / deselect, honouring the 2-device cap.
  function onCheckboxClick(card) {
    var isSelected = card.classList.contains('is-selected');
    if (!isSelected && selectedCount() >= MAX_SELECTED) {
      // At capacity — briefly flag the counter instead of selecting a 3rd.
      if (countEl) {
        countEl.classList.add('is-at-capacity');
        countEl.animate(
          [{ transform: 'translateX(0)' }, { transform: 'translateX(3px)' },
           { transform: 'translateX(-3px)' }, { transform: 'translateX(0)' }],
          { duration: 180 }
        );
      }
      return;
    }
    setSelected(card, !isSelected);
    refreshCounter();
  }

  // Cross actionable: remove the row from the list.
  function onCrossClick(card) {
    var item = card.closest('[role="listitem"]');
    if (item) item.remove();
    refreshCounter();
  }

  document.querySelectorAll('.checkbox-card').forEach(function (card) {
    var cb = card.querySelector('.checkbox');
    var cross = card.querySelector('.checkbox-card__cross');
    if (cb) cb.addEventListener('click', function () { onCheckboxClick(card); });
    if (cross) cross.addEventListener('click', function () { onCrossClick(card); });
  });

  // Toggle actionable (Dual Pairing).
  var toggle = document.querySelector('.toggle');
  if (toggle) {
    toggle.addEventListener('click', function () {
      var on = toggle.getAttribute('aria-checked') === 'true';
      toggle.setAttribute('aria-checked', String(!on));
    });
  }

  // Back button — inert in this static preview.
  var back = document.querySelector('.l1-nav__back');
  if (back) back.addEventListener('click', function (e) { e.preventDefault(); });

  refreshCounter();
})();
</script>
</body>
</html>
